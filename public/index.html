<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עץ משפחה</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { script: ['"Frank Ruhl Libre"', 'serif'], sans: ['Inter', 'sans-serif'] },
                    colors: { parchment: '#fdfbf7', leaf: { light: '#a3b18a', DEFAULT: '#588157', dark: '#344e41' } }
                }
            }
        }
    </script>

    <style>
        html, body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: #fdfbf7;
            margin: 0;
        }

        [contenteditable="true"] {
            transition: background-color 0.2s ease;
            outline: none;
        }

        /* Geometry is LTR even though the card contents are Hebrew/RTL. */
        #scroll-viewport {
            direction: ltr;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            cursor: grab;
            position: relative;
            overscroll-behavior: none;
        }

        #scroll-viewport:active { cursor: grabbing; }

        #canvas {
            position: relative;
            min-width: 100vw;
            min-height: 100vh;
        }

        .absolute-card {
            direction: rtl;
            position: absolute;
            transform: translateX(-50%);
            transform-origin: center top;
            transition:
                left 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                top 0.45s ease-out,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .absolute-card:hover {
            transform: translate(-50%, -4px);
            box-shadow: 0 10px 22px rgba(52, 78, 65, 0.15);
        }

        .sync-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.8rem;
            color: #888;
            transition: opacity 0.3s;
            z-index: 50;
        }
    </style>
</head>
<body class="text-gray-800 font-sans antialiased selection:bg-leaf-light selection:text-white">

    <div class="fixed top-0 left-0 w-full p-4 pointer-events-none z-50 flex justify-between items-start">
        <div class="pointer-events-auto bg-white/80 backdrop-blur px-5 py-3 rounded-lg shadow-sm border border-leaf-light/30">
            <h1 class="font-script text-3xl text-leaf-dark mb-0.5">עץ המשפחה שלנו</h1>
            <p class="text-gray-500 font-light tracking-widest text-[9px]">דורות של אהבה • גרור כדי לנווט</p>
        </div>
    </div>

    <div id="status" class="sync-status opacity-0 bg-white/90 px-3 py-1 rounded shadow">נשמר...</div>

    <div id="scroll-viewport">
        <div id="canvas">
            <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
            <div id="cards-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></div>
        </div>
    </div>

    <script>
        let isEditing = false;
        let globalNodes = [];
        let globalNodeMap = new Map();
        let globalUnits = [];
        let unitByNodeId = new Map();
        let dataSignature = '';
        let didInitialCenter = false;

        const SPOUSE_EDGE_GAP = 34;
        const UNIT_GAP = 90;
        const GENERATION_GAP = 150;
        const CANVAS_PAD_X = 240;
        const CANVAS_PAD_TOP = 180;
        const CANVAS_PAD_BOTTOM = 220;
        const CARD_FALLBACK_WIDTH = 170;
        const CARD_FALLBACK_HEIGHT = 100;
        const ORDER_SWEEPS = 8;
        const POSITION_SWEEPS = 10;

        const viewport = document.getElementById('scroll-viewport');
        const canvas = document.getElementById('canvas');
        const cardsLayer = document.getElementById('cards-layer');
        const svgLayer = document.getElementById('svg-layer');

        // Drag to pan.
        let isDragging = false, startX, startY, scrollLeft, scrollTop;
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.absolute-card')) return;
            isDragging = true;
            startX = e.pageX - viewport.offsetLeft;
            startY = e.pageY - viewport.offsetTop;
            scrollLeft = viewport.scrollLeft;
            scrollTop = viewport.scrollTop;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            viewport.scrollLeft = scrollLeft - ((e.pageX - viewport.offsetLeft) - startX);
            viewport.scrollTop = scrollTop - ((e.pageY - viewport.offsetTop) - startY);
        });

        function cleanNullable(value) {
            return value === null || value === undefined || value === '' ||
                value === 'null' || value === 'undefined' ? null : value;
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function signatureFor(nodes) {
            return JSON.stringify(nodes.map(n => [
                n.id, n.parent_id, n.spouse_id, n.name, n.dates,
                n.description, n.last_updated
            ]));
        }

        function captureAnchor(preferredId = null) {
            let node = preferredId ? globalNodeMap.get(preferredId) : null;
            if (!node && globalNodes.length) {
                const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
                const centerY = viewport.scrollTop + viewport.clientHeight / 2;
                node = globalNodes.reduce((best, candidate) => {
                    if (candidate.x == null || candidate.targetY == null) return best;
                    const d = Math.abs(candidate.x - centerX) + Math.abs(candidate.targetY - centerY);
                    return !best || d < best.d ? { node: candidate, d } : best;
                }, null)?.node;
            }
            if (!node || node.x == null || node.targetY == null) return null;
            return {
                id: node.id,
                screenX: node.x - viewport.scrollLeft,
                screenY: node.targetY - viewport.scrollTop
            };
        }

        function restoreAnchor(anchor) {
            if (!anchor) return;
            const node = globalNodeMap.get(anchor.id);
            if (!node || node.x == null || node.targetY == null) return;
            viewport.scrollLeft = Math.max(0, node.x - anchor.screenX);
            viewport.scrollTop = Math.max(0, node.targetY - anchor.screenY);
        }

        async function loadTree(anchorId = null, force = false) {
            const anchor = didInitialCenter ? captureAnchor(anchorId) : null;
            try {
                const res = await fetch('/api/nodes', { cache: 'no-store' });
                if (!res.ok) throw new Error(await res.text());

                const incoming = await res.json();
                incoming.forEach(n => {
                    n.parent_id = cleanNullable(n.parent_id);
                    n.spouse_id = cleanNullable(n.spouse_id);
                });

                const nextSignature = signatureFor(incoming);
                if (!force && nextSignature === dataSignature) return;
                dataSignature = nextSignature;

                globalNodes = incoming;
                globalNodeMap = new Map(globalNodes.map(n => [n.id, n]));

                renderCards();
                requestAnimationFrame(() => {
                    layoutAndRender();
                    if (!didInitialCenter) {
                        centerInitialTree();
                        didInitialCenter = true;
                    } else {
                        restoreAnchor(anchor);
                    }
                });
            } catch (err) {
                console.error('Failed to load family tree:', err);
                showStatus('שגיאה בטעינת העץ');
            }
        }

        function createCardHTML(node) {
            const hasParent = !!node.parent_id && globalNodeMap.has(node.parent_id);
            const hasSpouse = !!node.spouse_id && globalNodeMap.has(node.spouse_id);
            const id = escapeHTML(node.id);

            return `
                <div id="card-${id}" data-node-id="${id}"
                     class="absolute-card pointer-events-auto bg-white px-3 py-2 w-max min-w-[140px] max-w-[200px] shadow-md border-t-[3px] border-leaf rounded-lg z-20">
                    <button data-action="delete" data-id="${id}"
                            class="absolute -top-1.5 -left-1.5 text-red-300 hover:text-red-500 font-bold bg-white rounded-full w-4 h-4 flex items-center justify-center shadow z-30 transition text-[10px]">✕</button>
                    ${!hasParent ? `
                        <button data-action="add-parent" data-id="${id}"
                                class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-leaf-light text-white text-[8px] px-2 py-0.5 rounded-full hover:bg-leaf shadow z-30 transition">+ הורה</button>
                    ` : ''}
                    ${!hasSpouse ? `
                        <button data-action="add-spouse" data-id="${id}"
                                class="absolute -top-2.5 right-1 bg-pink-100 text-pink-700 text-[8px] px-2 py-0.5 rounded-full hover:bg-pink-200 shadow z-30 transition">♥ זוג</button>
                    ` : ''}

                    <h2 contenteditable="true" data-id="${id}" data-field="name"
                        class="font-script font-bold text-xl text-leaf-dark mt-1 mb-0.5 text-center break-words focus:bg-leaf-light/10 rounded min-h-[28px] leading-tight">${escapeHTML(node.name || 'שם')}</h2>
                    <p contenteditable="true" data-id="${id}" data-field="dates"
                       class="text-center text-[9px] text-gray-500 mb-1 break-words focus:bg-leaf-light/10 rounded">${escapeHTML(node.dates || 'תאריכים')}</p>
                    <p contenteditable="true" data-id="${id}" data-field="description"
                       class="text-[9px] text-gray-600 text-center break-words focus:bg-leaf-light/10 rounded leading-tight">${escapeHTML(node.description || 'תיאור')}</p>

                    <button data-action="add-child" data-id="${id}"
                            class="absolute -bottom-2.5 left-1/2 -translate-x-1/2 bg-leaf text-white text-[8px] px-2 py-0.5 rounded-full hover:bg-leaf-dark shadow z-30 transition">+ ילד</button>
                </div>`;
        }

        function renderCards() {
            cardsLayer.innerHTML = globalNodes.map(createCardHTML).join('');
        }

        function measureCards() {
            globalNodes.forEach(node => {
                const card = document.getElementById(`card-${node.id}`);
                const rect = card?.getBoundingClientRect();
                node.cardWidth = Math.max(1, rect?.width || CARD_FALLBACK_WIDTH);
                node.cardHeight = Math.max(1, rect?.height || CARD_FALLBACK_HEIGHT);
            });
        }

        // A couple is one indivisible layout unit. Reverse spouse links are accepted too,
        // so older/asymmetric data still renders as a couple.
        function buildFamilyUnits() {
            globalUnits = [];
            unitByNodeId = new Map();
            const claimed = new Set();
            const reverseSpouse = new Map();

            for (const node of globalNodes) {
                if (node.spouse_id && globalNodeMap.has(node.spouse_id)) {
                    reverseSpouse.set(node.spouse_id, node);
                }
            }

            const sorted = [...globalNodes].sort((a, b) => a.id.localeCompare(b.id));
            for (const node of sorted) {
                if (claimed.has(node.id)) continue;

                const directSpouse = node.spouse_id ? globalNodeMap.get(node.spouse_id) : null;
                const spouse = directSpouse || reverseSpouse.get(node.id) || null;
                let members = [node];

                if (spouse && !claimed.has(spouse.id) && spouse.id !== node.id) {
                    members = [node, spouse].sort((a, b) => a.id.localeCompare(b.id));
                    claimed.add(spouse.id);
                }

                claimed.add(node.id);

                const unit = {
                    id: members.map(m => m.id).join('::'),
                    members,
                    parents: new Set(),
                    children: new Set(),
                    gen: null,
                    width: 0,
                    height: 0,
                    centerX: 0,
                    component: -1
                };

                globalUnits.push(unit);
                members.forEach(member => unitByNodeId.set(member.id, unit));
            }

            for (const unit of globalUnits) {
                for (const member of unit.members) {
                    const parentUnit = member.parent_id ? unitByNodeId.get(member.parent_id) : null;
                    if (parentUnit && parentUnit !== unit) {
                        unit.parents.add(parentUnit);
                        parentUnit.children.add(unit);
                    }
                }
            }

            for (const unit of globalUnits) {
                if (unit.members.length === 2) {
                    unit.width = unit.members[0].cardWidth + SPOUSE_EDGE_GAP + unit.members[1].cardWidth;
                } else {
                    unit.width = unit.members[0].cardWidth;
                }
                unit.height = Math.max(...unit.members.map(m => m.cardHeight));
            }
        }

        // Solve generation constraints exactly across each connected family component:
        //   spouse = same generation (already one unit)
        //   child  = parent generation + 1
        // Parentless people are NOT automatically generation zero. This matters when
        // spouses bring ancestry branches of different depth into the same family.
        function assignGenerations() {
            globalUnits.forEach(unit => {
                unit.gen = null;
                unit.component = -1;
            });

            let componentId = 0;
            const seeds = [...globalUnits].sort((a, b) => a.id.localeCompare(b.id));

            for (const seed of seeds) {
                if (seed.gen !== null) continue;

                seed.gen = 0;
                seed.component = componentId;
                const queue = [seed];
                const component = [];
                let conflict = false;

                while (queue.length) {
                    const unit = queue.shift();
                    component.push(unit);

                    const neighbors = [
                        ...[...unit.parents].map(parent => ({ unit: parent, expected: unit.gen - 1 })),
                        ...[...unit.children].map(child => ({ unit: child, expected: unit.gen + 1 }))
                    ].sort((a, b) => a.unit.id.localeCompare(b.unit.id));

                    for (const edge of neighbors) {
                        if (edge.unit.gen === null) {
                            edge.unit.gen = edge.expected;
                            edge.unit.component = componentId;
                            queue.push(edge.unit);
                        } else if (edge.unit.gen !== edge.expected) {
                            conflict = true;
                            console.error(
                                'Inconsistent family generation constraints:',
                                unit.id, '->', edge.unit.id,
                                'expected', edge.expected, 'found', edge.unit.gen
                            );
                        }
                    }
                }

                const minGen = Math.min(...component.map(unit => unit.gen));
                component.forEach(unit => unit.gen -= minGen);

                if (conflict) {
                    console.warn('This family component contains contradictory parent/spouse generation constraints.');
                }
                componentId++;
            }

            globalUnits.forEach(unit => {
                unit.members.forEach(member => member.gen = unit.gen);
            });
        }

        function generationsMap() {
            const byGen = new Map();
            for (const unit of globalUnits) {
                if (!byGen.has(unit.gen)) byGen.set(unit.gen, []);
                byGen.get(unit.gen).push(unit);
            }
            return byGen;
        }

        function indexMap(units) {
            return new Map(units.map((unit, index) => [unit, index]));
        }

        function average(values, fallback = 0) {
            return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : fallback;
        }

        function parentSignature(unit) {
            if (!unit.parents.size) return `~${unit.id}`;
            return [...unit.parents].map(parent => parent.id).sort().join('|');
        }

        // Siblings sharing the same set of parent-family units form an indivisible block
        // for ordering purposes. This prevents an upward sweep from inserting a bridge
        // child (or an unrelated node) between ordinary siblings.
        function siblingBlocks(units) {
            const oldIndex = indexMap(units);
            const groups = new Map();

            for (const unit of units) {
                const key = parentSignature(unit);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(unit);
            }

            return [...groups.entries()].map(([key, members]) => ({
                key,
                members: members.sort((a, b) =>
                    oldIndex.get(a) - oldIndex.get(b) || a.id.localeCompare(b.id)
                ),
                old: average(members.map(member => oldIndex.get(member)))
            })).sort((a, b) => a.old - b.old || a.key.localeCompare(b.key));
        }

        // Repeated barycentric sweeps minimize crossings between adjacent generations,
        // but all reordering happens at sibling-block granularity. A married child whose
        // spouse connects to another ancestry branch naturally gets a different parent
        // signature and is therefore pulled to the outer edge nearest that branch.
        function orderGenerations(byGen) {
            const gens = [...byGen.keys()].sort((a, b) => a - b);
            gens.forEach(gen => byGen.get(gen).sort((a, b) => a.id.localeCompare(b.id)));

            for (let pass = 0; pass < ORDER_SWEEPS; pass++) {
                // Downward sweep: order sibling blocks by the horizontal order of all
                // parent-family units feeding them.
                for (let gi = 1; gi < gens.length; gi++) {
                    const prev = byGen.get(gens[gi - 1]);
                    const prevIndex = indexMap(prev);
                    const blocks = siblingBlocks(byGen.get(gens[gi]));

                    for (const block of blocks) {
                        const positions = block.members.flatMap(member =>
                            [...member.parents]
                                .filter(parent => prevIndex.has(parent))
                                .map(parent => prevIndex.get(parent))
                        );
                        block.score = positions.length ? average(positions) : block.old;
                    }

                    blocks.sort((a, b) =>
                        a.score - b.score || a.old - b.old || a.key.localeCompare(b.key)
                    );
                    byGen.set(gens[gi], blocks.flatMap(block => block.members));
                }

                // Upward sweep: move whole sibling blocks toward their descendants.
                // Members may reorder inside their own block, but the block itself can
                // never be split by another family.
                for (let gi = gens.length - 2; gi >= 0; gi--) {
                    const next = byGen.get(gens[gi + 1]);
                    const nextIndex = indexMap(next);
                    const blocks = siblingBlocks(byGen.get(gens[gi]));

                    for (const block of blocks) {
                        const oldMemberIndex = indexMap(block.members);
                        block.members.sort((a, b) => {
                            const aChildren = [...a.children]
                                .filter(child => nextIndex.has(child))
                                .map(child => nextIndex.get(child));
                            const bChildren = [...b.children]
                                .filter(child => nextIndex.has(child))
                                .map(child => nextIndex.get(child));
                            const ax = aChildren.length ? average(aChildren) : oldMemberIndex.get(a);
                            const bx = bChildren.length ? average(bChildren) : oldMemberIndex.get(b);
                            return ax - bx ||
                                oldMemberIndex.get(a) - oldMemberIndex.get(b) ||
                                a.id.localeCompare(b.id);
                        });

                        const positions = block.members.flatMap(member =>
                            [...member.children]
                                .filter(child => nextIndex.has(child))
                                .map(child => nextIndex.get(child))
                        );
                        block.score = positions.length ? average(positions) : block.old;
                    }

                    blocks.sort((a, b) =>
                        a.score - b.score || a.old - b.old || a.key.localeCompare(b.key)
                    );
                    byGen.set(gens[gi], blocks.flatMap(block => block.members));
                }
            }
        }

        function unitSeparation(left, right) {
            return left.width / 2 + UNIT_GAP + right.width / 2;
        }

        // Compact one generation as close as possible to relationship targets while
        // respecting its established order and exact rectangle spacing.
        function compactGeneration(units, targets) {
            if (!units.length) return;
            if (units.length === 1) {
                units[0].centerX = targets.get(units[0]) ?? units[0].centerX ?? 0;
                return;
            }

            const positions = units.map(unit => {
                const target = targets.get(unit);
                return Number.isFinite(target) ? target : (Number.isFinite(unit.centerX) ? unit.centerX : 0);
            });

            for (let i = 1; i < units.length; i++) {
                positions[i] = Math.max(
                    positions[i],
                    positions[i - 1] + unitSeparation(units[i - 1], units[i])
                );
            }

            for (let i = units.length - 2; i >= 0; i--) {
                positions[i] = Math.min(
                    positions[i],
                    positions[i + 1] - unitSeparation(units[i], units[i + 1])
                );
            }

            // Recenter the packed row around its requested targets. Translation cannot
            // break spacing, and makes same-target siblings straddle the parent center.
            const requested = units.map((unit, i) => {
                const value = targets.get(unit);
                return Number.isFinite(value) ? value : positions[i];
            });
            const delta = average(requested.map((value, i) => value - positions[i]));

            units.forEach((unit, i) => unit.centerX = positions[i] + delta);
        }

        function simplePack(units) {
            if (!units.length) return;
            let cursor = 0;
            for (const unit of units) {
                unit.centerX = cursor + unit.width / 2;
                cursor += unit.width + UNIT_GAP;
            }
            const total = cursor - UNIT_GAP;
            units.forEach(unit => unit.centerX -= total / 2);
        }

        function layoutUnits() {
            const byGen = generationsMap();
            const gens = [...byGen.keys()].sort((a, b) => a - b);
            orderGenerations(byGen);
            gens.forEach(gen => simplePack(byGen.get(gen)));

            // Alternating sweeps make newly-created relatives land close to their target:
            // parents chase children upward; children/siblings chase parents downward.
            for (let pass = 0; pass < POSITION_SWEEPS; pass++) {
                for (let gi = gens.length - 2; gi >= 0; gi--) {
                    const units = byGen.get(gens[gi]);
                    const targets = new Map();
                    for (const unit of units) {
                        const children = [...unit.children].filter(child => child.gen === unit.gen + 1);
                        targets.set(unit, children.length ? average(children.map(child => child.centerX)) : unit.centerX);
                    }
                    compactGeneration(units, targets);
                }

                for (let gi = 1; gi < gens.length; gi++) {
                    const units = byGen.get(gens[gi]);
                    const targets = new Map();
                    for (const unit of units) {
                        const parents = [...unit.parents].filter(parent => parent.gen === unit.gen - 1);
                        targets.set(unit, parents.length ? average(parents.map(parent => parent.centerX)) : unit.centerX);
                    }
                    compactGeneration(units, targets);
                }
            }

            // One final upward pass centers parents over their finished child groups.
            for (let gi = gens.length - 2; gi >= 0; gi--) {
                const units = byGen.get(gens[gi]);
                const targets = new Map();
                for (const unit of units) {
                    const children = [...unit.children].filter(child => child.gen === unit.gen + 1);
                    targets.set(unit, children.length ? average(children.map(child => child.centerX)) : unit.centerX);
                }
                compactGeneration(units, targets);
            }

            const minLeft = Math.min(...globalUnits.map(unit => unit.centerX - unit.width / 2));
            const offsetX = CANVAS_PAD_X - minLeft;
            globalUnits.forEach(unit => unit.centerX += offsetX);
            return byGen;
        }

        function assignVerticalPositions(byGen) {
            const gens = [...byGen.keys()].sort((a, b) => a - b);
            let y = CANVAS_PAD_TOP;

            for (const gen of gens) {
                const units = byGen.get(gen);
                const bandHeight = Math.max(...units.map(unit => unit.height), CARD_FALLBACK_HEIGHT);
                units.forEach(unit => unit.members.forEach(member => member.targetY = y));
                y += bandHeight + GENERATION_GAP;
            }
        }

        // Prefer the side of a couple that keeps a person's own lineage straight.
        // Parents have priority; when parents are not recorded, direct children provide
        // a weaker but still useful side hint. This makes parent-family order and spouse
        // order agree instead of visually crossing through the marriage block.
        function memberLineageTargetX(member) {
            const unit = unitByNodeId.get(member.id);
            if (!unit) return null;

            if (member.parent_id) {
                const parentUnit = unitByNodeId.get(member.parent_id);
                if (parentUnit && parentUnit.gen === unit.gen - 1) {
                    return parentUnit.centerX;
                }
            }

            const childUnits = globalNodes
                .filter(child => child.parent_id === member.id)
                .map(child => unitByNodeId.get(child.id))
                .filter(childUnit => childUnit && childUnit.gen === unit.gen + 1);

            return childUnits.length ? average(childUnits.map(childUnit => childUnit.centerX)) : null;
        }

        function orientCouples() {
            for (const unit of globalUnits) {
                if (unit.members.length !== 2) continue;

                const [a, b] = unit.members;
                const ax = memberLineageTargetX(a);
                const bx = memberLineageTargetX(b);
                let left = a;
                let right = b;

                if (Number.isFinite(ax) && Number.isFinite(bx) && Math.abs(ax - bx) > 1) {
                    if (ax > bx) {
                        left = b;
                        right = a;
                    }
                } else if (Number.isFinite(ax) && !Number.isFinite(bx)) {
                    if (ax > unit.centerX + 1) {
                        left = b;
                        right = a;
                    }
                } else if (!Number.isFinite(ax) && Number.isFinite(bx)) {
                    if (bx < unit.centerX - 1) {
                        left = b;
                        right = a;
                    }
                }

                unit.members = [left, right];
            }
        }

        function positionMembers() {
            orientCouples();

            for (const unit of globalUnits) {
                if (unit.members.length === 1) {
                    unit.members[0].x = unit.centerX;
                    continue;
                }

                const [left, right] = unit.members;
                left.x = unit.centerX - (SPOUSE_EDGE_GAP / 2 + left.cardWidth / 2);
                right.x = unit.centerX + (SPOUSE_EDGE_GAP / 2 + right.cardWidth / 2);
            }
        }

        function updateCanvasBounds() {
            const maxRight = Math.max(...globalNodes.map(node => node.x + node.cardWidth / 2));
            const maxBottom = Math.max(...globalNodes.map(node => node.targetY + node.cardHeight));
            const width = Math.max(viewport.clientWidth, Math.ceil(maxRight + CANVAS_PAD_X));
            const height = Math.max(viewport.clientHeight, Math.ceil(maxBottom + CANVAS_PAD_BOTTOM));

            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            svgLayer.setAttribute('width', width);
            svgLayer.setAttribute('height', height);
            svgLayer.setAttribute('viewBox', `0 0 ${width} ${height}`);
        }

        function syncCardPositions() {
            globalNodes.forEach(node => {
                const card = document.getElementById(`card-${node.id}`);
                if (!card) return;
                card.style.left = `${node.x}px`;
                card.style.top = `${node.targetY}px`;
            });
        }

        function svgPath(d, width = 2) {
            return `<path d="${d}" stroke="#a3b18a" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" fill="none" />`;
        }

        function drawSVGLines() {
            let svgHTML = '';

            // Marriage lines connect the actual inner card edges.
            for (const unit of globalUnits) {
                if (unit.members.length !== 2) continue;
                const [left, right] = unit.members;
                const y = left.targetY + Math.min(32, Math.min(left.cardHeight, right.cardHeight) / 2);
                const x1 = left.x + left.cardWidth / 2;
                const x2 = right.x - right.cardWidth / 2;
                svgHTML += svgPath(`M ${x1} ${y} L ${x2} ${y}`, 2.5);
            }

            // Each family gets one sibling bus. Because exact generation constraints put
            // every valid child exactly one band below its parent, every connector stays
            // inside the empty inter-generation corridor and cannot pass through an
            // unrelated card in an intermediate generation.
            for (const unit of globalUnits) {
                const childNodes = globalNodes
                    .filter(child => {
                        if (!child.parent_id) return false;
                        const parentUnit = unitByNodeId.get(child.parent_id);
                        return parentUnit === unit && child.gen === unit.gen + 1;
                    })
                    .sort((a, b) => a.x - b.x);

                if (!childNodes.length) continue;

                let startX, startY;
                if (unit.members.length === 2) {
                    const [left, right] = unit.members;
                    startX = unit.centerX;
                    startY = left.targetY + Math.min(32, Math.min(left.cardHeight, right.cardHeight) / 2);
                } else {
                    const parent = unit.members[0];
                    startX = parent.x;
                    startY = parent.targetY + parent.cardHeight;
                }

                const childTop = Math.min(...childNodes.map(child => child.targetY));
                const midY = startY + Math.max(48, (childTop - startY) * 0.52);
                const childXs = childNodes.map(child => child.x);
                const minX = Math.min(startX, ...childXs);
                const maxX = Math.max(startX, ...childXs);

                svgHTML += svgPath(`M ${startX} ${startY} L ${startX} ${midY}`);
                if (maxX > minX) svgHTML += svgPath(`M ${minX} ${midY} L ${maxX} ${midY}`);
                childNodes.forEach(child => {
                    svgHTML += svgPath(`M ${child.x} ${midY} L ${child.x} ${child.targetY}`);
                });
            }

            svgLayer.innerHTML = svgHTML;
        }

        function assertLayout() {
            const byGen = new Map();
            globalNodes.forEach(node => {
                if (!byGen.has(node.gen)) byGen.set(node.gen, []);
                byGen.get(node.gen).push(node);
            });

            for (const [gen, nodes] of byGen) {
                for (let i = 0; i < nodes.length; i++) {
                    const a = nodes[i];
                    for (let j = i + 1; j < nodes.length; j++) {
                        const b = nodes[j];
                        const xOverlap = Math.abs(a.x - b.x) < (a.cardWidth + b.cardWidth) / 2 - 0.5;
                        const yOverlap = Math.abs(a.targetY - b.targetY) < Math.min(a.cardHeight, b.cardHeight) - 0.5;
                        if (xOverlap && yOverlap) {
                            console.error(`Layout overlap in generation ${gen}:`, a.id, b.id);
                        }
                    }
                }
            }

            globalNodes.forEach(child => {
                if (!child.parent_id) return;
                const parent = globalNodeMap.get(child.parent_id);
                if (parent && child.gen !== parent.gen + 1) {
                    console.error(
                        'Parent/child edge is not exactly one generation:',
                        parent.id, parent.gen, '->', child.id, child.gen
                    );
                }
            });

            for (const unit of globalUnits) {
                if (unit.members.length !== 2) continue;
                const [a, b] = unit.members;
                if (a.gen !== b.gen) console.error('Spouses on different generations:', a.id, b.id);
                const actualGap = (b.x - b.cardWidth / 2) - (a.x + a.cardWidth / 2);
                if (Math.abs(actualGap - SPOUSE_EDGE_GAP) > 0.5) {
                    console.error('Spouse gap violated:', a.id, b.id, actualGap);
                }
            }
        }

        function layoutAndRender() {
            if (!globalNodes.length) {
                cardsLayer.innerHTML = '';
                svgLayer.innerHTML = '';
                return;
            }

            measureCards();
            buildFamilyUnits();
            assignGenerations();
            const byGen = layoutUnits();
            assignVerticalPositions(byGen);
            positionMembers();
            updateCanvasBounds();
            syncCardPositions();

            requestAnimationFrame(() => {
                drawSVGLines();
                assertLayout();
            });
        }

        function centerInitialTree() {
            if (!globalUnits.length) return;

            // Prefer a well-connected family near the top of the component rather than
            // simply the leftmost arbitrary root.
            const minGen = Math.min(...globalUnits.map(unit => unit.gen));
            const candidates = globalUnits
                .filter(unit => unit.gen <= minGen + 1)
                .sort((a, b) =>
                    b.children.size - a.children.size ||
                    a.centerX - b.centerX ||
                    a.id.localeCompare(b.id)
                );
            const focal = candidates[0] || globalUnits[0];

            viewport.scrollLeft = Math.max(0, focal.centerX - viewport.clientWidth / 2);
            const topY = Math.min(...focal.members.map(member => member.targetY));
            viewport.scrollTop = Math.max(0, topY - 120);
        }

        async function saveEdit(element) {
            const id = element.getAttribute('data-id');
            const field = element.getAttribute('data-field');
            const value = element.innerText.trim();
            const node = globalNodeMap.get(id);
            if (node) node[field] = value;

            showStatus('שומר...');
            const res = await fetch(`/api/nodes/${encodeURIComponent(id)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ [field]: value })
            });

            if (!res.ok) {
                showStatus('שגיאה בשמירה');
                return;
            }

            const anchor = captureAnchor(id);
            layoutAndRender();
            requestAnimationFrame(() => restoreAnchor(anchor));
            showStatus('נשמר בהצלחה');
        }

        async function addChild(parentId) {
            const id = 'node_' + Math.random().toString(36).slice(2, 11);
            showStatus('מוסיף ילד...');
            const res = await fetch('/api/nodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, parent_id: parentId })
            });
            if (!res.ok) return showStatus('שגיאה בהוספה');
            await loadTree(parentId, true);
            showStatus('נשמר בהצלחה');
        }

        async function addParent(childId) {
            const newParentId = 'node_' + Math.random().toString(36).slice(2, 11);
            showStatus('מוסיף הורה...');

            const postRes = await fetch('/api/nodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: newParentId })
            });

            if (postRes.ok) {
                const patchRes = await fetch(`/api/nodes/${encodeURIComponent(childId)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ parent_id: newParentId })
                });
                if (!patchRes.ok) return showStatus('שגיאה בהוספה');
            } else {
                return showStatus('שגיאה בהוספה');
            }

            await loadTree(childId, true);
            showStatus('נשמר בהצלחה');
        }

        async function addSpouse(partnerId) {
            const spouseId = 'node_' + Math.random().toString(36).slice(2, 11);
            showStatus('מוסיף בן/בת זוג...');

            const postRes = await fetch('/api/nodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: spouseId, spouse_id: partnerId })
            });

            if (postRes.ok) {
                const patchRes = await fetch(`/api/nodes/${encodeURIComponent(partnerId)}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ spouse_id: spouseId })
                });
                if (!patchRes.ok) return showStatus('שגיאה בהוספה');
            } else {
                return showStatus('שגיאה בהוספה');
            }

            await loadTree(partnerId, true);
            showStatus('נשמר בהצלחה');
        }

        async function deleteNode(id) {
            if (!confirm('האם אתה בטוח שברצונך למחוק איש קשר זה?')) return;

            const deleted = globalNodeMap.get(id);
            const anchorId = deleted?.parent_id || deleted?.spouse_id || null;
            showStatus('מוחק...');

            const res = await fetch(`/api/nodes/${encodeURIComponent(id)}`, { method: 'DELETE' });
            if (!res.ok) return showStatus('שגיאה במחיקה');

            await loadTree(anchorId, true);
            showStatus('נמחק');
        }

        function showStatus(msg) {
            const status = document.getElementById('status');
            status.innerText = msg;
            status.classList.remove('opacity-0');
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => status.classList.add('opacity-0'), 1800);
        }

        cardsLayer.addEventListener('click', (e) => {
            const button = e.target.closest('[data-action]');
            if (!button) return;

            const id = button.dataset.id;
            switch (button.dataset.action) {
                case 'add-child': addChild(id); break;
                case 'add-parent': addParent(id); break;
                case 'add-spouse': addSpouse(id); break;
                case 'delete': deleteNode(id); break;
            }
        });

        document.body.addEventListener('focusin', (e) => {
            if (e.target.hasAttribute('contenteditable')) isEditing = true;
        });

        document.body.addEventListener('focusout', (e) => {
            if (!e.target.hasAttribute('contenteditable')) return;
            isEditing = false;
            saveEdit(e.target);
        });

        window.addEventListener('resize', () => {
            if (!globalNodes.length) return;
            const anchor = captureAnchor();
            layoutAndRender();
            requestAnimationFrame(() => restoreAnchor(anchor));
        });

        // Poll for multi-client edits, but unchanged data does not cause a relayout.
        setInterval(() => {
            if (!isEditing) loadTree(null, false);
        }, 5000);

        loadTree(null, true);
    </script>
</body>
</html>
