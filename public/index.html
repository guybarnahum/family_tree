<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עץ משפחה</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { script: ['"Frank Ruhl Libre"', 'serif'], sans: ['Inter', 'sans-serif'] },
                    colors: { parchment: '#fdfbf7', leaf: { light: '#a3b18a', DEFAULT: '#588157', dark: '#344e41' } }
                }
            }
        }
    </script>

    <style>
        html, body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: #fdfbf7;
            margin: 0;
        }

        [contenteditable="true"] {
            transition: background-color 0.2s ease;
            outline: none;
        }

        #scroll-viewport {
            direction: ltr;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            position: relative;
            overscroll-behavior: none;
        }

        #canvas {
            position: relative;
            min-width: 100vw;
            min-height: 100vh;
        }

        .absolute-card {
            direction: rtl;
            position: absolute;
            transform: translateX(-50%);
            transform-origin: center top;
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .absolute-card:hover {
            transform: translate(-50%, -4px);
            box-shadow: 0 10px 22px rgba(52, 78, 65, 0.15);
        }

        .sync-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.8rem;
            color: #888;
            transition: opacity 0.3s;
            z-index: 50;
        }
    </style>
</head>
<body class="text-gray-800 font-sans antialiased selection:bg-leaf-light selection:text-white">
    <div class="fixed top-0 left-0 w-full p-4 pointer-events-none z-[220] flex justify-between items-start">
        <div class="pointer-events-auto bg-white/80 backdrop-blur px-5 py-3 rounded-lg shadow-sm border border-leaf-light/30">
            <h1 class="font-script text-3xl text-leaf-dark mb-0.5">עץ המשפחה שלנו</h1>
            <p class="text-gray-500 font-light tracking-widest text-[9px]">דורות של אהבה • גרור כדי לנווט</p>
        </div>
    </div>

    <div id="status" class="sync-status opacity-0 bg-white/90 px-3 py-1 rounded shadow">נשמר...</div>

    <div id="scroll-viewport">
        <div id="canvas">
            <svg id="svg-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
            <div id="cards-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></div>
        </div>
    </div>
</body>
</html>
